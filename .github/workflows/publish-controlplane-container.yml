name: Publicar ControlPlane

on:
  push:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pedroaraujox/trat-controlplane

jobs:
  agent:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.ambiente.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Definir ambiente
        id: ambiente
        shell: pwsh
        run: |
          switch ('${{ github.ref_name }}') {
            'development' {
              "url=https://trat-hml.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=development" >> $env:GITHUB_OUTPUT
            }
            'production' {
              "url=https://trat.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=production" >> $env:GITHUB_OUTPUT
            }
            default {
              throw 'Este workflow somente pode publicar as branches development ou production.'
            }
          }
      - name: Gerar instalador do Agent
        shell: pwsh
        run: .\scripts\agent\Publish-Agent.ps1 -ControlPlaneBaseUrl '${{ steps.ambiente.outputs.url }}'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package/TRAT.Agent.Standalone/TRAT.Agent.Setup.exe
          if-no-files-found: error

  container:
    needs: agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package/TRAT.Agent.Standalone
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.agent.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
