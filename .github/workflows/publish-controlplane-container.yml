name: Publicar ControlPlane

on:
  push:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-controlplane-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/pedroaraujox/trat-controlplane

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar dependencias
        run: dotnet restore .\WebstationBackup.sln
      - name: Testar solucao
        run: dotnet test .\tests\ControlPlane.Api.Tests\ControlPlane.Api.Tests.csproj -c Release --no-restore
      - name: Compilar solucao
        run: dotnet build .\WebstationBackup.sln -c Release --no-restore

  agent:
    needs: validate
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.ambiente.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Definir ambiente
        id: ambiente
        shell: pwsh
        run: |
          switch ('${{ github.ref_name }}') {
            'development' {
              "url=https://trat-hml.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=development" >> $env:GITHUB_OUTPUT
              "profile=hml" >> $env:GITHUB_OUTPUT
            }
            'production' {
              "url=https://trat.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=production" >> $env:GITHUB_OUTPUT
              "profile=production" >> $env:GITHUB_OUTPUT
            }
            default {
              throw 'Este workflow somente pode publicar as branches development ou production.'
            }
          }
      - name: Gerar instalador do Agent
        shell: pwsh
        run: .\scripts\agent\Publish-Agent.ps1 -EnvironmentProfile '${{ steps.ambiente.outputs.profile }}' -PackageOutputDir 'artifacts\agent-package-release' -BuildRevision '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package-release/TRAT.Agent.Standalone/*
          if-no-files-found: error

  container:
    needs: [validate, agent]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package-release/TRAT.Agent.Standalone
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.agent.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            AGENT_PACKAGE_PATH=artifacts/agent-package-release/
            BUILD_REVISION=${{ github.sha }}
