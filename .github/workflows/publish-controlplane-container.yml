name: Publicar ControlPlane

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-controlplane-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/pedroaraujox/trat-controlplane

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes do painel, Agent e dependencias
        shell: pwsh
        run: ./scripts/ci/Test-System.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-results
          path: artifacts/mvp-validation/
      - name: Gate de producao
        if: github.ref_name == 'production' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          APPROVED: ${{ vars.HML_APPROVED_REVISION }}
          REVISION: ${{ github.sha }}
        run: |
          if ($env:APPROVED -ne $env:REVISION) { throw 'Revisao ainda nao aprovada apos teste real do Agent em hml.' }
          ./scripts/ci/Wait-Deployment.ps1 -PanelUrl 'https://trat-hml.outboxtech.com.br' -Environment hml -Revision $env:REVISION -TimeoutSeconds 30

  agent:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.ambiente.outputs.tag }}
      profile: ${{ steps.ambiente.outputs.profile }}
      url: ${{ steps.ambiente.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Definir ambiente
        id: ambiente
        shell: pwsh
        run: |
          switch ('${{ github.ref_name }}') {
            'development' {
              "url=https://trat-hml.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=development" >> $env:GITHUB_OUTPUT
              "profile=hml" >> $env:GITHUB_OUTPUT
            }
            'production' {
              "url=https://trat.outboxtech.com.br" >> $env:GITHUB_OUTPUT
              "tag=production" >> $env:GITHUB_OUTPUT
              "profile=production" >> $env:GITHUB_OUTPUT
            }
            default {
              throw 'Este workflow somente pode publicar as branches development ou production.'
            }
          }
      - name: Gerar instalador do Agent
        shell: pwsh
        run: .\scripts\agent\Publish-Agent.ps1 -EnvironmentProfile '${{ steps.ambiente.outputs.profile }}' -PackageOutputDir 'artifacts\agent-package-release' -BuildRevision '${{ github.sha }}' -SkipZip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package-release/TRAT.Agent.Standalone/*
          if-no-files-found: error

  container:
    needs: [validate, agent]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-download
          path: artifacts/agent-package-release/TRAT.Agent.Standalone
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.agent.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            AGENT_PACKAGE_PATH=artifacts/agent-package-release/
            BUILD_REVISION=${{ github.sha }}

  deploy:
    needs: [agent, container]
    runs-on: ubuntu-24.04
    environment: ${{ needs.agent.outputs.profile }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar compose imutavel apos imagem estar disponivel
        shell: pwsh
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.container.outputs.digest }}
          PROFILE: ${{ needs.agent.outputs.profile }}
        run: ./scripts/ci/Publish-DeploymentBranch.ps1 -Environment $env:PROFILE -Revision $env:REVISION -ImageDigest $env:DIGEST
      - name: Verificar deploy efetivo e pacote do Agent
        shell: pwsh
        env:
          REVISION: ${{ github.sha }}
          PROFILE: ${{ needs.agent.outputs.profile }}
          PANEL_URL: ${{ needs.agent.outputs.url }}
        run: ./scripts/ci/Wait-Deployment.ps1 -Environment $env:PROFILE -Revision $env:REVISION -PanelUrl $env:PANEL_URL
