version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: trat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trat_controlplane
      POSTGRES_USER: trat_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trat_admin -d trat_controlplane"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TRAT ControlPlane API
  controlplane:
    image: trat-controlplane:latest
    container_name: trat-controlplane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=trat_controlplane;User Id=trat_admin;Password=${DB_PASSWORD};SslMode=Disable;"
      ControlPlane__Security__AgentToken: ${AGENT_TOKEN}
      ControlPlane__Security__AdminToken: ${ADMIN_TOKEN}
      ControlPlane__BootstrapAdmin__Email: ${ADMIN_EMAIL}
      ControlPlane__BootstrapAdmin__DisplayName: "Administrador"
      ControlPlane__BootstrapAdmin__Password: ${ADMIN_PASSWORD}
      ControlPlane__AgentDownloads__ArtifactsRoot: "/app/artifacts"
      ControlPlane__Database__UsePostgres: "true"
    volumes:
      - controlplane_data:/app/data
      - controlplane_artifacts:/app/artifacts
      - controlplane_keys:/app/data/keys
    ports:
      - "5000:5000"
    networks:
      - trat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy + HTTPS
  nginx:
    image: nginx:alpine
    container_name: trat-nginx
    restart: unless-stopped
    depends_on:
      - controlplane
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - trat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  controlplane_data:
    driver: local
  controlplane_artifacts:
    driver: local
  controlplane_keys:
    driver: local
  nginx_cache:
    driver: local

networks:
  trat-network:
    driver: bridge
