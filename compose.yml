name: trat-local

services:
  preparar-volumes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_PACKAGE_PATH: ${TRAT_AGENT_PACKAGE_PATH:-artifacts/agent-package-local/}
    image: trat-controlplane:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1654:1654 /app/data /app/backups"]
    volumes:
      - trat_local_data:/app/data
      - trat_local_backups:/app/backups
    network_mode: none
    restart: "no"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  controlplane:
    image: trat-controlplane:local
    container_name: trat-local
    restart: unless-stopped
    depends_on:
      preparar-volumes:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AllowedHosts: localhost;127.0.0.1
      ControlPlane__Database__SqlitePath: /app/data/controlplane.db
      ControlPlane__AgentDownloads__ArtifactsRoot: /app/artifacts/agent-package
      ControlPlane__Environment__Name: local
      ControlPlane__Environment__PublicUrl: http://localhost:5080
      ControlPlane__Environment__Revision: local
      ControlPlane__Security__RequireHttps: "false"
      ControlPlane__Security__UseForwardedHeaders: "false"
      ControlPlane__Security__EnableAdminApi: "false"
      ControlPlane__BootstrapAdmin__Email: ${TRAT_ADMIN_EMAIL:-admin@trat.local}
      ControlPlane__BootstrapAdmin__DisplayName: ${TRAT_ADMIN_NAME:-Administrador TRAT Local}
      ControlPlane__BootstrapAdmin__Password: ${TRAT_ADMIN_PASSWORD:-TRAT-local-change-me-2026}
      ControlPlane__Seed__EnableDemoData: ${TRAT_ENABLE_DEMO_DATA:-false}
      ControlPlane__Backup__Enabled: "true"
      ControlPlane__Backup__Directory: /app/backups
      ControlPlane__Backup__IntervalHours: "24"
      ControlPlane__Backup__InitialDelaySeconds: "60"
      ControlPlane__Backup__RetentionDays: "7"
    ports:
      - "${TRAT_LOCAL_PORT:-5080}:8080"
    volumes:
      - trat_local_data:/app/data
      - trat_local_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  trat_local_data:
  trat_local_backups:
